<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOT PLAY Cloud Dashboard</title>
    <!-- MQTT Library via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        :root {
            --bg-pearlescent: #f8f9fb;
            --card-surface: #ffffff;
            --border-subtle: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-dark: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-pearlescent);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-dark);
            letter-spacing: 0.5px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background-color: rgba(239, 68, 68, 0.1);
            color: #dc2626;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .status-badge.connected {
            background-color: rgba(16, 185, 129, 0.1);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #f8fafc;
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-dark);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-connect {
            background-color: var(--accent-dark);
            color: #fff;
            margin-bottom: 20px;
        }

        .btn-connect:hover {
            opacity: 0.9;
        }

        .divider {
            border: 0;
            border-top: 1px solid var(--border-subtle);
            margin: 20px 0;
        }

        .section-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn-control {
            background-color: #f1f5f9;
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
        }

        .btn-control:hover {
            background-color: #e2e8f0;
        }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn-mood {
            color: #fff;
            opacity: 0.95;
        }

        .btn-mood:hover {
            opacity: 1;
        }

        .mood-normal { background-color: #3b82f6; }
        .mood-happy { background-color: #10b981; }
        .mood-sleepy { background-color: #6366f1; }
        .mood-angry { background-color: #ef4444; }

        @media (min-width: 768px) {
            .dashboard-container {
                padding: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h2>MOT PLAY</h2>
            <div id="statusBadge" class="status-badge">Offline</div>
        </div>

        <div class="input-group">
            <label for="deviceId">Device ID</label>
            <input type="text" id="deviceId" placeholder="e.g. MOT-A1B2">
        </div>
        <button class="btn btn-connect" onclick="connectMQTT()">Connect Device</button>

        <hr class="divider">

        <div class="section-title">Quick Toggles</div>
        <div class="controls-grid">
            <button class="btn btn-control" onclick="sendCmd('toggle_sound')">Sound</button>
            <button class="btn btn-control" onclick="sendCmd('toggle_theme')">Theme</button>
        </div>

        <div class="section-title">Virtual Pet Mood</div>
        <div class="mood-grid">
            <button class="btn btn-mood mood-normal" onclick="sendCmd('mood:0')">Normal</button>
            <button class="btn btn-mood mood-happy" onclick="sendCmd('mood:1')">Happy</button>
            <button class="btn btn-mood mood-sleepy" onclick="sendCmd('mood:2')">Sleepy</button>
            <button class="btn btn-mood mood-angry" onclick="sendCmd('mood:3')">Angry</button>
        </div>
    </div>

    <script>
        let client;
        const statusBadge = document.getElementById('statusBadge');

        function connectMQTT() {
            const devId = document.getElementById('deviceId').value.trim();
            if(!devId) { alert('Please enter your Device ID!'); return; }
            
            statusBadge.innerText = "Connecting...";
            
            // Menggunakan broker Mosquitto test server via Secure WebSocket
            client = mqtt.connect('wss://test.mosquitto.org:8081/mqtt');

            client.on('connect', function () {
                statusBadge.innerText = "Connected";
                statusBadge.classList.add('connected');
            });

            client.on('error', function (err) {
                statusBadge.innerText = "Error";
                statusBadge.classList.remove('connected');
                client.end();
            });
        }

        function sendCmd(cmd) {
            const devId = document.getElementById('deviceId').value.trim();
            if (!client || !client.connected) {
                alert('Please connect to the device first!');
                return;
            }
            const topic = "motplay/device/" + devId + "/cmd";
            client.publish(topic, cmd);
        }
    </script>
</body>
</html>
